name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Placeholder values: the app only needs them to initialise the Firebase SDK; e2e tests fake Firebase and the API (see e2e/fakeBackend.ts).
env:
  VITE_APP_FIREBASE_API_KEY: ci-placeholder
  VITE_APP_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
  VITE_APP_FIREBASE_PROJECT_ID: ci-placeholder
  VITE_APP_FIREBASE_STORAGE_BUCKET: ci-placeholder.appspot.com
  VITE_APP_FIREBASE_MESSAGING_SENDER_ID: "0"
  VITE_APP_FIREBASE_APP_ID: ci-placeholder

# Separate jobs for what is slow or needs different services; lint and type check are quick enough to share one.
jobs:
  check:
    name: Lint and type check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm lint
      - run: pnpm exec tsc --noEmit

  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: pnpm exec vite build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 1

  api-test:
    name: API tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f db/schema.sql
      - run: pnpm test

  e2e:
    name: End-to-end tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      # System libraries are not cached, so they are installed either way.
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
